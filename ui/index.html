<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catacomb</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="panel">
    <header>
      <h1>CATACOMB</h1>
      <p class="sub">parallel generative synthesizer · test panel (the full panel arrives in M4)</p>
    </header>
    <section class="bits">
      <div class="row"><span class="label">SEQ1</span><div class="leds" id="seq1"></div></div>
      <div class="row"><span class="label">SEQ2</span><div class="leds" id="seq2"></div></div>
    </section>
    <section class="buttons">
      <button data-button="RunStop">RUN / STOP</button>
      <button data-button="Trigger">TRIGGER</button>
      <button data-button="Reset">RESET</button>
      <button data-button="Flip1">BIT FLIP 1</button>
      <button data-button="Flip2">BIT FLIP 2</button>
      <button data-button="Chain">CHAIN SEQ</button>
      <button data-action="reroll">RE-ROLL NOTES</button>
    </section>
    <footer id="status">connecting…</footer>
  </main>
  <script type="module" src="src/main.js"></script>
</body>
</html>
